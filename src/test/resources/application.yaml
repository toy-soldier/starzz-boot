spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true

app:
  security:
    password-reset-sentinel: resetRequired
    jwt-secret: test-secret-key-for-integration-tests-only
    jwt-expiration: 86400000
  admins:
    - admin1
    - admin2
    - admin3
