spring:
  application:
    name: starzz-boot
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  security:
    password-reset-sentinel: resetRequired
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: 86400000
  admins:
    - admin1
    - admin2
    - admin3
